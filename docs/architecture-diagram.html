<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mod-ui architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2e1f33;
      --color-muted:   #5c4a64;
      --color-accent:  #a84e0a;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1280px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · mod-ui</p>
    <h1>Browser, Tornado backend and the audio device</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-modui-title architecture-modui-desc">
        <title id="architecture-modui-title">mod-ui architecture</title>
        <desc id="architecture-modui-desc">The browser UI in html/ talks over HTTP and a WebSocket to a Tornado webserver in mod/, which drives Session and Host; Host controls mod-host over TCP, the HMI over serial and Control Chain devices over a socket.</desc>
        <defs>
          <pattern id="architecture-modui-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(46,31,51,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5c4a64"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a84e0a"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#883996"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#architecture-modui-dots)" opacity="0.55"/>

        <!-- Zones -->
        <rect x="40" y="72" width="208" height="464" rx="8" fill="rgba(46,31,51,0.02)" stroke="rgba(46,31,51,0.10)" stroke-width="0.8"/>
        <rect x="90" y="76" width="108" height="12" rx="2" fill="#f5f5f5"/>
        <text x="144" y="85" fill="#6f5a78" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">HTML/ · FRONTEND</text>
        <rect x="304" y="72" width="680" height="464" rx="8" fill="rgba(46,31,51,0.02)" stroke="rgba(46,31,51,0.10)" stroke-width="0.8"/>
        <rect x="574" y="76" width="140" height="12" rx="2" fill="#f5f5f5"/>
        <text x="644" y="85" fill="#6f5a78" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">MOD/ · PYTHON BACKEND</text>
        <rect x="1040" y="72" width="200" height="464" rx="8" fill="rgba(46,31,51,0.02)" stroke="rgba(46,31,51,0.10)" stroke-width="0.8"/>
        <rect x="1090" y="76" width="100" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1140" y="85" fill="#6f5a78" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">OUTSIDE PYTHON</text>

        <line x1="328" y1="320" x2="232" y2="320" stroke="#a84e0a" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <line x1="728" y1="304" x2="792" y2="304" stroke="#5c4a64" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Host -> libmod_utils -->
        <line x1="876" y1="344" x2="876" y2="400" stroke="#5c4a64" stroke-width="1.2" marker-end="url(#arrow)"/>

        <path d="M 960,284 H 1000 Q 1008,284 1008,276 V 176 Q 1008,168 1016,168 H 1056" fill="none" stroke="#5c4a64" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 960,324 H 1000 Q 1008,324 1008,332 V 432 Q 1008,440 1016,440 H 1056" fill="none" stroke="#5c4a64" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Webserver renders pages from html/ (dashed: read from disk) -->
        <path d="M 412,344 V 432 Q 412,440 404,440 H 232" fill="none" stroke="#5c4a64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <rect x="64" y="408" width="36" height="12" rx="2" fill="transparent" stroke="rgba(92,74,100,0.50)" stroke-width="0.8"/>

        <text x="412" y="320" fill="#5c4a64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">webserver.py · Tornado</text>
        <text x="412" y="334" fill="#5c4a64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">HTTP + 3 WebSockets</text>
        <!-- Node: Session -->
        <rect x="560" y="264" width="168" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="560" y="264" width="168" height="80" rx="6" fill="#ffffff" stroke="#2e1f33" stroke-width="1"/>
        <rect x="568" y="272" width="20" height="12" rx="2" fill="transparent" stroke="rgba(46,31,51,0.40)" stroke-width="0.8"/>
        <text x="578" y="281" fill="#2e1f33" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PY</text>
        <text x="644" y="304" fill="#2e1f33" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Session</text>
        <text x="644" y="320" fill="#5c4a64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">session.py · prefs</text>
        <text x="644" y="334" fill="#5c4a64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">owns Host, HMI, recorder</text>
        <!-- Node: Host -->
        <rect x="792" y="264" width="168" height="80" rx="6" fill="#f5f5f5"/>

        <rect x="800" y="272" width="32" height="12" rx="2" fill="transparent" stroke="rgba(168,78,10,0.50)" stroke-width="0.8"/>
        <text x="816" y="281" fill="#a84e0a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>

        <text x="1140" y="198" fill="#5c4a64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">knobs · buttons · screens</text>
        <!-- Node: mod-host -->

        <text x="1140" y="304" fill="#2e1f33" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">mod-host</text>
        <text x="1140" y="320" fill="#5c4a64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">TCP :5555</text>
        <text x="1140" y="334" fill="#5c4a64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">JACK audio · LV2 plugins</text>
