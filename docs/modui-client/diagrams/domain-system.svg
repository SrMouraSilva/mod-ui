<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 592" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="domain-system-title domain-system-desc">
<title id="domain-system-title">System</title>
<desc id="domain-system-desc">SystemApi reads the device information, pings the HMI and reads the system settings; everything that changes the system or deletes data is behind SystemDanger, which must only be called after a person confirmed.</desc>
<metadata><![CDATA[
GENERATED by docs/modui-client/diagrams/src/build.py from specs.py (domain-system). Do not edit this file by hand.
Content of the diagram as Mermaid (a summary for readers and AI tools; the layout lives in specs.py):

classDiagram
  direction LR
  class SystemInfo {
    <<wire>>
    release , controller: string
    hwname , model , platform
    uptime: number or null
    uname , python
    host?: MOD Desktop only
  }
  note for SystemInfo "GET /system/info"
  class SystemApi {
    <<focal class>>
    info()
    ping() → online, roundTripMs
    settings.get()
    danger
  }
  note for SystemApi "client.system"
  class SystemDanger {
    <<class>>
    settings.set(patch)
    startHmiUpdate()
    reboot() , restoreFactory()
    backup.export , import(opts)
    cleanup(options)
    saveUserId(user)
    uploadControlChainFirmware()
    cancelControlChainUpdate()
  }
  note for SystemDanger "client.system.danger"
  class SystemSettings {
    <<data>>
    bluetoothName: string
    jackBufferSize: number
    jackMonoCopy , jackSyncMode
    separateSpdifOuts , autorestartHmi
    modPeakmeter , modSdk , netmanager
  }
  note for SystemSettings "GET /system/prefs"
  class CleanupOptions {
    <<data>>
    banks , favorites
    hmiSettings , licenseKeys
    pedalboards , plugins
  }
  note for CleanupOptions "POST /system/cleanup"
  SystemApi ..> SystemInfo : info()
  SystemApi "1" *-- "1" SystemDanger : danger
  SystemApi ..> SystemSettings : settings.get()
  SystemDanger ..> CleanupOptions : cleanup()
  note "Everything in danger can lose data, stop the device or change its owner. Ask a person first; AI tools must always confirm with a human."
]]></metadata>
