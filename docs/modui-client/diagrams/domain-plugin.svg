<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 876" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="domain-plugin-title domain-plugin-desc">
<title id="domain-plugin-title">Plugin</title>
<desc id="domain-plugin-desc">A Plugin from the installed catalogue is described by PluginInfo; a PluginInstance in the running pedalboard has ports, control parameters, patch parameters and presets.</desc>
<metadata><![CDATA[
GENERATED by docs/modui-client/diagrams/src/build.py from specs.py (domain-plugin). Do not edit this file by hand.
Content of the diagram as Mermaid (a summary for readers and AI tools; the layout lives in specs.py):

classDiagram
  direction LR
  class Plugin {
    <<class>>
    uri , name: string
    brand , label: string
    category: string[]
    gui: PluginGui
    info()
  }
  note for Plugin "client.device.plugins.list()"
  class PluginInfo {
    <<wire>>
    …the PluginSummary fields
    version , stability: string
    ports: audio , midi , cv , control
    parameters?: patch params
    presets?: stale after a save
  }
  note for PluginInfo "GET /effect/get?uri="
  class PluginInstance {
    <<focal class>>
    instance: /graph/Gain
    uri: string
    x , y: number
    alive: boolean
    preset: string or null
    info: PluginInfo or null
    isActive() , setActive(b)
    toggle() , setPosition(p)
    port(symbol) , remove()
    on(event) , once(event)
  }
  note for PluginInstance "one block of the running graph"
  class PluginPatchParams {
    <<see another diagram>>
  }
  class Param {
    <<class>>
    symbol , name: string
    default , minimum , maximum
    designation: string
    properties: string[]
    value: number (live)
    setValue(v) , on(change)
  }
  class Port {
    <<class>>
    id: /graph/Gain/in
    symbol , name: string
    type: audio or midi or cv
    direction: input or output
    owner: PluginInstance
  }
  class PluginPresets {
    <<see another diagram>>
  }
  Plugin ..> PluginInfo : info()
  PluginInstance "0..*" *-- "0..1" PluginInfo : info
  PluginInstance "0..*" ..> "1" Plugin : instance of
  PluginInstance "1" *-- "0..*" PluginPatchParams : patchParams
  PluginInstance "1" *-- "0..*" Param : params
  PluginInstance "1" *-- "0..*" Port : ports
  PluginInstance "1" *-- "1" PluginPresets : presets
  note "Params come from the control ports of PluginInfo; Ports from audio, midi and cv. plugin.gui: see the plugin GUI diagram."
]]></metadata>
