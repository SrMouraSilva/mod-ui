classDiagram
  direction LR
  class PedalboardReference {
    <<see another diagram>>
  }
  class Device {
    <<focal class>>
    stats , sysStats
    transport , bufferSize
    trueBypass , snapshot
    load(target)
    loadDefault() , reset()
    setBufferSize(BufferSize)
    setTrueBypass( left, right )
    resetXruns() , switchCpuFrequency()
    on(event) , once(event)
  }
  note for Device "client.device"
  class CurrentPedalboard {
    <<see another diagram>>
  }
  class LoadResult {
    <<data>>
    bundlepath: string
    name: string
    snapshotId: number
  }
  class Devicereports {
    <<data>>
    stats: cpuLoad, xruns
    sysStats: memLoad, cpuFreqKhz, cpuTempMilli
    transport: rolling, beatsPerBar, bpm, syncMode
    bufferSize: frames
    trueBypass: left, right
    snapshot: index, name
  }
  note for Devicereports "last value; null until reported"
  class PluginsApi {
    <<class>>
    list() , get(uri)
    getDefaultTemplates()
  }
  note for PluginsApi "client.device.plugins"
  class Plugin {
    <<see another diagram>>
  }
  Device ..> PedalboardReference : load(target)
  Device "1" *-- "1" CurrentPedalboard : running
  Device ..> LoadResult : load()
  Device "1" *-- "1" Devicereports : reports
  Device "1" *-- "1" PluginsApi : plugins
  PluginsApi "1" ..> "0..*" Plugin : list()
]]></metadata>
