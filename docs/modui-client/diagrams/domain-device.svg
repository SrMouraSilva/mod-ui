<svg viewBox="0 0 960 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="domain-device-title domain-device-desc">
<title id="domain-device-title">Device</title>
<desc id="domain-device-desc">Device owns the running pedalboard and the plugin catalogue, loads pedalboards and returns a LoadResult, and keeps the last values the device reported, such as load, transport and buffer size.</desc>
<metadata><![CDATA[
