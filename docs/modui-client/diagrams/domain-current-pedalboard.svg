classDiagram
  direction LR
  class PedalboardSnapshots {
    <<see another diagram>>
  }
  class CurrentPedalboard {
    <<focal class>>
    plugins.list , add , remove
    connections.list , connect , disconnect
    ports.list , ports.audio.input()
    get , save , saveAs
    on , once , getSnapshot , subscribe
  }
  note for CurrentPedalboard "client.device.currentPedalboard"
  class PedalboardSnapshot {
    <<data>>
    version: number
    ready , loading: boolean
    plugins: PluginSnapshot[]
    connections: ConnectionSnapshot[]
    ports: PortSnapshot[]
  }
  note for PedalboardSnapshot "currentPedalboard.getSnapshot()"
  class PluginInstance {
    <<see another diagram>>
  }
  class Port {
    <<class>>
    id: /graph/Gain/in
    symbol , name: string
    type: audio or midi or cv
    direction: input or output
    owner: PluginInstance or null
  }
  class PedalboardConnection {
    <<class>>
    id: string
    from: Port
    to: Port
  }
  CurrentPedalboard "1" *-- "1" PedalboardSnapshots : snapshots
  CurrentPedalboard ..> PedalboardSnapshot : getSnapshot()
  CurrentPedalboard "1" *-- "0..*" PluginInstance : plugins
  CurrentPedalboard "1" *-- "0..*" Port : ports
  CurrentPedalboard "1" *-- "0..*" PedalboardConnection : connections
  PluginInstance "0..1" *-- "0..*" Port : ports
  PedalboardConnection "2" *-- "0..*" Port : from, to
  note "No endpoint lists the running plugins or connections: the client rebuilds them from the frames of the WebSocket."
]]></metadata>
