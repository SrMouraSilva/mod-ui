<title id="domain-current-pedalboard-title">Current pedalboard</title>
<desc id="domain-current-pedalboard-desc">CurrentPedalboard holds the live plugin instances, the pedalboard own ports and the connections between ports, its snapshots, and an immutable state snapshot for UI frameworks.</desc>
<metadata><![CDATA[
