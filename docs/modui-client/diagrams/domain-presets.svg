<svg viewBox="0 0 960 608" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="domain-presets-title domain-presets-desc">
<title id="domain-presets-title">Plugin presets</title>
<desc id="domain-presets-desc">PluginPresets of an instance wraps the entries of one PresetCatalog per plugin URI into Preset objects; the entries come from GET /effect/get_non_cached as PluginPresetInfo.</desc>
<metadata><![CDATA[
GENERATED by docs/modui-client/diagrams/src/build.py from specs.py (domain-presets). Do not edit this file by hand.
Content of the diagram as Mermaid (a summary for readers and AI tools; the layout lives in specs.py):

classDiagram
  direction LR
  class PluginInstance {
    <<see another diagram>>
  }
  class PluginPresets {
    <<class>>
    currentUri: string or null
    current: Preset or null
    list() , get(uri)
    load(preset or uri)
    create(name)
    save(preset, name?)
    delete(preset)
    on(list)
  }
  note for PluginPresets "instance.presets"
  class Preset {
    <<focal class>>
    uri , label: string
    bundlepath: string or null
    isUser , isCurrent: boolean
    alive: boolean
    load() , save(name?)
    delete()
  }
  class PluginsApi {
    <<see another diagram>>
  }
  class PresetCatalog {
    <<internal>>
    source: GET /effect/get_non_cached
    presets: PluginPresetInfo[]
    update() after a save
  }
  note for PresetCatalog "one per plugin URI"
  class PluginPresetInfo {
    <<wire>>
    valid: boolean
    uri , label: string
    path: bundle dir,  = factory
  }
  PluginInstance "1" *-- "1" PluginPresets : presets
  PluginPresets "1" *-- "0..*" Preset : list()
  PluginPresets "0..*" ..> "1" PresetCatalog : shares
  PluginsApi "1" *-- "0..*" PresetCatalog : per uri
  PresetCatalog "1" *-- "0..*" PluginPresetInfo : entries
  Preset "0..*" ..> "1" PluginPresetInfo : built from
  note "Two instances of the same plugin see the same list: one catalogue per URI, wrapped per instance."
]]></metadata>
