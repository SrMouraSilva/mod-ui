<title id="domain-pedalboard-title">Pedalboard library</title>
<desc id="domain-pedalboard-desc">PedalboardsApi lists PedalboardReference handles; each handle holds a PedalboardSummary and PedalboardImages and can read the full PedalboardInfo; banks hold references.</desc>
<metadata><![CDATA[
GENERATED by docs/modui-client/diagrams/src/build.py from specs.py (domain-pedalboard). Do not edit this file by hand.
Content of the diagram as Mermaid (a summary for readers and AI tools; the layout lives in specs.py):

classDiagram
  direction LR
  class PedalboardsApi {
    <<class>>
    list()
  }
  note for PedalboardsApi "client.pedalboards"
  class PedalboardReference {
    <<focal class>>
    bundlepath: string
    title , uri: string
    broken , factory: boolean
    hasTrialPlugins: boolean
    version: number
    isDefault: boolean
    info() , copy() , delete()
  }
  class Bank {
    <<see another diagram>>
  }
  class PedalboardSummary {
    <<wire>>
    broken , factory: boolean
    hasTrialPlugins: boolean
    uri , title: string
    bundle: string
    version: number
  }
  note for PedalboardSummary "GET /pedalboard/list"
  class PedalboardImages {
    <<class>>
    getThumbnailUrl()
    getScreenshotUrl()
    status() , generate()
  }
  note for PedalboardImages "reference.images"
  class PedalboardInfo {
    <<wire>>
    bundlepath: string (client)
    title: string
    width , height: number
    factory , version
    plugins , connections
    hardware , timeInfo
  }
  note for PedalboardInfo "GET /pedalboard/info/"
  class ImageStatus {
    <<data>>
    Missing
    Generating
    Available
  }
  PedalboardsApi "1" ..> "0..*" PedalboardReference : list()
  Bank "0..*" *-- "0..*" PedalboardReference : holds
  PedalboardReference "1" *-- "1" PedalboardSummary : summary
  PedalboardReference "1" *-- "1" PedalboardImages : images
  PedalboardReference ..> PedalboardInfo : info()
  PedalboardImages ..> ImageStatus : status()
  note "A reference is a cheap handle built from the list; the full bundle is read only when you call info()."
]]></metadata>
