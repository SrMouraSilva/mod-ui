<title id="domain-banks-title">Banks</title>
<desc id="domain-banks-desc">BanksApi reads banks as BankSummary and writes the whole list as BankInput; a Bank holds an ordered list of pedalboard references.</desc>
<metadata><![CDATA[
GENERATED by docs/modui-client/diagrams/src/build.py from specs.py (domain-banks). Do not edit this file by hand.
Content of the diagram as Mermaid (a summary for readers and AI tools; the layout lives in specs.py):

classDiagram
  direction LR
  class ModUiClient {
    <<see another diagram>>
  }
  class BanksApi {
    <<class>>
    list() , get(title)
    create(title, pedalboards?)
    move(bank, toIndex)
    replaceAll(banks)
  }
  note for BanksApi "client.banks"
  class Bank {
    <<focal class>>
    title: string
    index: number
    pedalboards: PedalboardReference[]
    rename(title) , delete()
    add(ref,  at, copyFactory )
    remove(ref or index)
    move(from, to)
    setPedalboards(refs)
  }
  class BankInput {
    <<wire>>
    title: string
    pedalboards:  bundle, title []
  }
  note for BankInput "POST /banks/save"
  class BankSummary {
    <<wire>>
    title: string
    pedalboards: PedalboardSummary[]
    …extra properties are kept
  }
  note for BankSummary "GET /banks"
  class PedalboardReference {
    <<see another diagram>>
  }
  ModUiClient "1" *-- "1" BanksApi : banks
  BanksApi "1" ..> "0..*" Bank : creates
  Bank "1" *-- "0..*" PedalboardReference : pedalboards
  BanksApi ..> BankSummary : reads
  BanksApi ..> BankInput : writes
  note "Every edit reads the whole list, changes the copy and writes it back: last write wins."
]]></metadata>
