<svg viewBox="0 0 960 788" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="domain-pedalboard-bundle-title domain-pedalboard-bundle-desc">
<title id="domain-pedalboard-bundle-title">Pedalboard bundle</title>
<desc id="domain-pedalboard-bundle-desc">PedalboardInfo, read from GET /pedalboard/info/, contains plugins with their control port values, the connections, the hardware ports and the transport settings; MIDI assignments are MidiControl values.</desc>
<metadata><![CDATA[
GENERATED by docs/modui-client/diagrams/src/build.py from specs.py (domain-pedalboard-bundle). Do not edit this file by hand.
Content of the diagram as Mermaid (a summary for readers and AI tools; the layout lives in specs.py):

classDiagram
  direction LR
  class PedalboardInfo {
    <<focal wire>>
    bundlepath: string (client)
    title: string
    width , height: number
    factory: boolean
    midi_separated_mode
    midi_loopback: boolean
    version: number
  }
  note for PedalboardInfo "GET /pedalboard/info/"
  class PedalboardPlugin {
    <<wire>>
    instance: /graph/Gain
    uri: string
    bypassed: boolean
    x , y: number
    preset: string
  }
  class PedalboardInfoConnection {
    <<wire>>
    source: string
    target: string
  }
  note for PedalboardInfoConnection "port ids"
  class PedalboardHardware {
    <<wire>>
    audio_ins , audio_outs
    cv_ins , cv_outs
    midi_ins , midi_outs
    serial_midi_in , _out
    midi_merger_out
    midi_broadcaster_in
  }
  class PedalboardTimeInfo {
    <<wire>>
    available: bit mask
    bpb , bpm: number
    rolling: boolean
    bpbCC , bpmCC , rollingCC
  }
  class PedalboardPluginPort {
    <<wire>>
    symbol: string
    value: number
  }
  class MidiControl {
    <<wire>>
    channel , control: number
    hasRanges: boolean
    minimum , maximum
  }
  note for MidiControl "channel -1 = unmapped"
  PedalboardInfo "1" *-- "0..*" PedalboardPlugin : plugins
  PedalboardInfo "1" *-- "0..*" PedalboardInfoConnection : connections
  PedalboardInfo "1" *-- "1" PedalboardHardware : hardware
  PedalboardInfo "1" *-- "1" PedalboardTimeInfo : timeInfo
  PedalboardPlugin "1" *-- "0..*" PedalboardPluginPort : ports
  PedalboardPlugin "1" *-- "1" MidiControl : bypassCC
  PedalboardPluginPort "1" *-- "1" MidiControl : midiCC
  note "Every field ending in CC is a MidiControl: bypassCC, midiCC, bpbCC, bpmCC, rollingCC."
]]></metadata>
