classDiagram
  direction LR
  class PatchParam {
    <<see another diagram>>
  }
  class FilesApi {
    <<focal class>>
    list(types)
  }
  note for FilesApi "client.files"
  class UserFile {
    <<wire>>
    fullname: absolute path
    dirname , basename: string
    basepath: type folder
    filetype: string
  }
  note for UserFile "GET /files/list"
  PatchParam ..> FilesApi : fileTypes
  FilesApi "1" ..> "0..*" UserFile : list()
]]></metadata>
