<title id="domain-files-title">User files</title>
<desc id="domain-files-desc">FilesApi lists the user files of one or more types as UserFile values; the types a path parameter accepts are the fileTypes of its PatchParam.</desc>
<metadata><![CDATA[
GENERATED by docs/modui-client/diagrams/src/build.py from specs.py (domain-files). Do not edit this file by hand.
