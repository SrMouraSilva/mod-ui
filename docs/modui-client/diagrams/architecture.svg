<svg viewBox="0 0 1040 572" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
<title id="architecture-title">modui-client architecture</title>
<desc id="architecture-desc">Application code uses ModUiClient, whose HttpTransport and EventChannel talk to the Tornado webserver; the webserver drives Session and Host, which control mod-host and the HMI, and Host broadcasts every change to all WebSocket clients, the classic UI included.</desc>
<metadata><![CDATA[
GENERATED by docs/modui-client/diagrams/src/build.py from specs.py (architecture). Do not edit this file by hand.
Content of the diagram as Mermaid (a summary for readers and AI tools; the layout lives in specs.py):

flowchart LR
  subgraph BROWSER["BROWSER"]
    classic["Classic UI<br/>jQuery · host.js<br/>$.ajax + window.ws"]
    app["Application code<br/>new UI · console · tests<br/>browser or Node.js 22"]
  end
  subgraph MODUICLIENT["MODUI-CLIENT"]
    http["HttpTransport<br/>fetch · JSON<br/>non-2xx = HttpError"]
    client["ModUiClient<br/>client.pedalboards<br/>client.device · .banks"]
    chan["EventChannel<br/>WebSocket · replay<br/>waitFor() · reconnect"]
  end
  subgraph MODUISERVER["MOD-UI SERVER"]
    web["Webserver<br/>webserver.py · Tornado<br/>handlers · /websocket"]
    host["Session + Host<br/>session.py · host.py<br/>owns the running state"]
  end
  subgraph DEVICE["DEVICE"]
    mh["mod-host<br/>audio engine · LV2<br/>TCP :5555 / :5556"]
    hmi["HMI · Control Chain<br/>serial · pedals<br/>knobs and screens"]
  end
  app --> client
  client -->|"uses"| http
  client -->|"uses"| chan
  http -->|"fetch"| web
  chan <-->|"ws"| web
  classic -->|"ajax · ws"| web
  web -->|"calls"| host
  host -->|"broadcast"| web
  host -->|"tcp"| mh
  host -->|"serial"| hmi
]]></metadata>
