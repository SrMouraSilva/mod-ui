<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="domain-config-title domain-config-desc">
<title id="domain-config-title">Configuration</title>
<desc id="domain-config-desc">ConfigApi separates ModConfig, the typed preferences that mod-ui reads, from AppConfig, a JSON object of at most 10 KiB that an application keeps in the single preference modui-client.</desc>
<metadata><![CDATA[
GENERATED by docs/modui-client/diagrams/src/build.py from specs.py (domain-config). Do not edit this file by hand.
Content of the diagram as Mermaid (a summary for readers and AI tools; the layout lives in specs.py):

classDiagram
  direction LR
  class ConfigApi {
    <<class>>
    mod: ModConfig
    app: AppConfig
  }
  note for ConfigApi "client.config"
  class ModConfig {
    <<class>>
    getAll() → ModConfigData
    get(key)
    set(key, value)
  }
  note for ModConfig "client.config.mod"
  class ModConfigKey {
    <<data>>
    dev-mode: on or off
    plugins-folded , show-labs-plugins
    pb-view-mode: grid or list
    cloud-terms-accepted
    update-channel: stable or testing
  }
  note for ModConfigKey "enum: the keys mod-ui owns"
  class AppConfig {
    <<focal class>>
    at most 10 KiB of JSON
    getAll() , get(key)
    set(key, value)
    delete(key)
    replaceAll(values)
  }
  note for AppConfig "client.config.app"
  class Preferences {
    <<wire>>
    key → value (text)
    modui-client: JSON text
    api-key, secret: never sent
  }
  note for Preferences "GET /config/get , POST /config/set"
  ConfigApi "1" *-- "1" ModConfig : mod
  ConfigApi "1" *-- "1" AppConfig : app
  ModConfig ..> ModConfigKey : keys
  AppConfig ..> Preferences : one key
  note "Not secret: anyone who can reach the device reads it, and it is sent again with every page load."
]]></metadata>
