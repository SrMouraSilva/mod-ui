<title id="domain-snapshots-title">Pedalboard snapshots</title>
<desc id="domain-snapshots-desc">The running pedalboard has PedalboardSnapshots, a list of Snapshot objects identified by position; the names come from GET /snapshot/list and new ones from GET /snapshot/saveas.</desc>
<metadata><![CDATA[
GENERATED by docs/modui-client/diagrams/src/build.py from specs.py (domain-snapshots). Do not edit this file by hand.
Content of the diagram as Mermaid (a summary for readers and AI tools; the layout lives in specs.py):

classDiagram
  direction LR
  class CurrentPedalboard {
    <<see another diagram>>
  }
  class PedalboardSnapshots {
    <<class>>
    currentIndex: number or null
    current: Snapshot or null
    list() , get(index)
    save() , create(name)
    load(snapshot or index)
    on(current or list)
  }
  note for PedalboardSnapshots "currentPedalboard.snapshots"
  class Snapshot {
    <<focal class>>
    index: number
    name: string
    isCurrent , alive: boolean
    load() , rename(name)
    delete()
  }
  class SnapshotListResponse {
    <<wire>>
    Recordstring, string
    index (as text) → name
  }
  note for SnapshotListResponse "GET /snapshot/list"
  class SnapshotSaveAsResponse {
    <<wire>>
    ok: boolean
    id: number or null
    title: string
  }
  note for SnapshotSaveAsResponse "GET /snapshot/saveas"
  CurrentPedalboard "1" *-- "1" PedalboardSnapshots : snapshots
  PedalboardSnapshots "1" *-- "1..*" Snapshot : list()
  PedalboardSnapshots ..> SnapshotListResponse : reads
  PedalboardSnapshots ..> SnapshotSaveAsResponse : create()
  note "A snapshot is its position in the list: removing one renumbers the later ones. Not the same as getSnapshot()."
]]></metadata>
