classDiagram
  direction LR
  class PluginInstance {
    <<see another diagram>>
  }
  class PluginPatchParams {
    <<class>>
    list()
    get(uri)
  }
  note for PluginPatchParams "instance.patchParams"
  class PatchParam {
    <<focal class>>
    uri , label: string
    type: PatchParamType
    readable , writable: boolean
    default: PatchValue
    minimum , maximum: number
    fileTypes: string[]
    supportedExtensions: string[]
    value: PatchValue (live)
    refresh() , setValue(v)
    on(change)
  }
  class PatchParamType {
    <<data>>
    bool , int , long
    float , double
    string , path , uri
  }
  class PluginParameterInfo {
    <<wire>>
    uri , label: string
    type: atom type URI
    readable , writable: boolean
    ranges?: min, max, default
    fileTypes?: string[]
    supportedExtensions?: string[]
  }
  note for PluginParameterInfo "PluginInfo.parameters[]"
  PluginInstance "1" *-- "1" PluginPatchParams : patchParams
  PluginPatchParams "1" *-- "0..*" PatchParam : list()
  PatchParam "0..*" *-- "1" PatchParamType : type
  PatchParam "1" ..> "1" PluginParameterInfo : built from
  note "Not control ports: the values are typed (string, path, URI, bool, ...) and travel as patch_get and patch_set."
