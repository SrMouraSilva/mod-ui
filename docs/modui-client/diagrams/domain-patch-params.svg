<title id="domain-patch-params-title">Patch parameters</title>
<desc id="domain-patch-params-desc">A plugin instance exposes its patch parameters through PluginPatchParams; each PatchParam has a type and a live value and is built from the parameter description in PluginInfo.</desc>
<metadata><![CDATA[
