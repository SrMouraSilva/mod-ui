<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="domain-plugin-gui-title domain-plugin-gui-desc">
<title id="domain-plugin-gui-title">Plugin GUI files</title>
<desc id="domain-plugin-gui-desc">A Plugin has a PluginGui that builds the URLs of its thumbnail, screenshot and modgui files from its summary and reads their text through the GuiAssets cache that PluginsApi owns; the files it has are named by PluginInfo.gui.</desc>
<metadata><![CDATA[
GENERATED by docs/modui-client/diagrams/src/build.py from specs.py (domain-plugin-gui). Do not edit this file by hand.
Content of the diagram as Mermaid (a summary for readers and AI tools; the layout lives in specs.py):

classDiagram
  direction LR
  class Plugin {
    <<see another diagram>>
  }
  class PluginGui {
    <<focal class>>
    uri: string
    version: 7_2_1_0
    getFileUrl , getCustomFileUrl
    getResourceUrl(path)
    getThumbnailUrl , getScreenshotUrl
    get(file) , getAll()
  }
  note for PluginGui "plugin.gui"
  class GuiFiles {
    <<data>>
    iconTemplate: string or null
    settingsTemplate: string or null
    stylesheet , javascript
    errors: file, error
  }
  note for GuiFiles "gui.getAll()"
  class PluginsApi {
    <<class>>
    get(uri or summary)
    getDefaultTemplates()
    clearGuiCache()
  }
  note for PluginsApi "client.device.plugins"
  class GuiAssets {
    <<internal>>
    stamp: number
    text(path): cached
    info(uri)
  }
  class PluginGuiInfo {
    <<wire>>
    resourcesDirectory: string
    iconTemplate , settingsTemplate
    stylesheet , javascript
    documentation , screenshot
    thumbnail: string
  }
  note for PluginGuiInfo "PluginInfo.gui"
  Plugin "1" *-- "1" PluginGui : gui
  PluginGui ..> GuiFiles : getAll()
  PluginGui "0..*" ..> "1" GuiAssets : shares
  PluginsApi "1" *-- "1" GuiAssets : owns
  GuiAssets ..> PluginGuiInfo : reads
  PluginsApi "1" ..> "0..*" Plugin : get()
  note "The summary of GET /effect/list does not say which files a plugin has: get() reads PluginInfo.gui first and answers null for a file it lacks."
]]></metadata>
