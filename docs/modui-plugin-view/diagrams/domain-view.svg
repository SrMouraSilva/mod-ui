<svg viewBox="0 0 960 676" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="domain-view-title domain-view-desc">
<title id="domain-view-title">PluginView</title>
<desc id="domain-view-desc">A PluginView exposes the icon and settings elements, reads and writes values, and emits change, patch, active, preset, output, close, error and destroyed events; four of them carry a ViewOrigin.</desc>
<metadata><![CDATA[
GENERATED by docs/modui-client/diagrams/src/build.py from specs.py (domain-view). Do not edit this file by hand.
Content of the diagram as Mermaid (a summary for readers and AI tools; the layout lives in specs.py):

classDiagram
  direction LR
  class PluginViews {
    <<see another diagram>>
  }
  class PluginView {
    <<focal class>>
    icon: HTMLElement
    settings: HTMLElement
    uri: string
    info: PluginInfo
    instance: PluginInstance or null
    live , alive: boolean
    active: boolean
    preset: string or null
    getValue , setValue(symbol, v)
    getPatchValue , setPatchValue
    setActive(active) , getOutput
    on(event) , destroy()
  }
  class ViewEvents {
    <<data>>
    change: symbol, value
    patch: uri, value
    active: active
    preset: preset
    output: symbol, value
    close: settings Close button
    error: error, context, uri
    destroyed: reason
  }
  note for ViewEvents "first four carry an origin"
  class Widget {
    <<see another diagram>>
  }
  class ViewBackend {
    <<see another diagram>>
  }
  class ViewOrigin {
    <<data>>
    user: a gesture on this view
    script: the plugin script
    api: a call to the view
    external: anything else
  }
  PluginViews "1" *-- "0..*" PluginView : creates
  PluginView ..> ViewEvents : emits
  PluginView "1" *-- "0..*" Widget : widgets
  PluginView "1" *-- "1" ViewBackend : backend
  ViewEvents ..> ViewOrigin : origin
  note "Every change says who caused it, so your UI can ignore its own gestures."
]]></metadata>
