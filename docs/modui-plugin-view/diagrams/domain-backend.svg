<svg viewBox="0 0 960 736" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="domain-backend-title domain-backend-desc">
<title id="domain-backend-title">ViewBackend</title>
<desc id="domain-backend-desc">A PluginView talks to a ViewBackend; LiveBackend wraps a PluginInstance of modui-client and PreviewBackend keeps the values in memory; the backend notifies a BackendListener and may offer a PresetBackend.</desc>
<metadata><![CDATA[
GENERATED by docs/modui-client/diagrams/src/build.py from specs.py (domain-backend). Do not edit this file by hand.
Content of the diagram as Mermaid (a summary for readers and AI tools; the layout lives in specs.py):

classDiagram
  direction LR
  class PluginView {
    <<see another diagram>>
  }
  class LiveBackend {
    <<class>>
    wraps a PluginInstance
    writes through the client
    follows instance.on(...)
  }
  class ViewBackend {
    <<focal class>>
    live: boolean
    instance: PluginInstance or null
    presets: PresetBackend or null
    portValue(symbol, fallback)
    patchValue(uri) , preset()
    active() , setPort(symbol, v)
    setActive , setPatch , refreshPatch
    subscribe(listener)
  }
  note for ViewBackend "interface"
  class PreviewBackend {
    <<class>>
    values kept in memory
    nothing is sent
    no presets
  }
  class PluginInstance {
    <<see another diagram>>
  }
  class BackendListener {
    <<data>>
    param(symbol, value)
    active(active)
    patch(uri, value)
    preset(uri)
    presetList(presets)
    removed(reason)
  }
  class PresetBackend {
    <<data>>
    list()
    load(uri) , create(name)
    save(uri, name?)
    delete(uri)
  }
  PluginView "1" *-- "1" ViewBackend : backend
  LiveBackend ..> ViewBackend : implements
  PreviewBackend ..> ViewBackend : implements
  LiveBackend "1" ..> "1" PluginInstance : wraps
  ViewBackend ..> BackendListener : subscribe
  ViewBackend "1" *-- "0..1" PresetBackend : presets
]]></metadata>
