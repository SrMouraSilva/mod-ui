<title id="domain-script-title">Plugin script</title>
<desc id="domain-script-desc">A ScriptRunner compiles the modgui JavaScript into a ScriptCallback and calls it with start, change and end events and with ScriptFuncs to write values; start carries the current values as ScriptStart.</desc>
<metadata><![CDATA[
GENERATED by docs/modui-client/diagrams/src/build.py from specs.py (domain-script). Do not edit this file by hand.
Content of the diagram as Mermaid (a summary for readers and AI tools; the layout lives in specs.py):

classDiagram
  direction LR
  class PluginView {
    <<see another diagram>>
  }
  class ScriptRunner {
    <<focal internal>>
    active: boolean
    icon , settings: jQuery objects
    start(values)
    change(change)
    end()
  }
  class ScriptCallback {
    <<data>>
    fn(event, funcs) returns void
    event: start or change or end
    event.icon , event.settings
  }
  note for ScriptCallback "compileScript(code)"
  class ScriptFuncs {
    <<data>>
    set_port_value(symbol, v)
    patch_get(uri)
    patch_set(uri, type, v)
    get_custom_resource_filename
    get_port_index_for_symbol
    get_port_symbol_for_index
  }
  class ScriptStart {
    <<data>>
    ports:  symbol, value []
    parameters:  uri, value []
  }
  PluginView "1" *-- "0..1" ScriptRunner : script
  ScriptRunner ..> ScriptCallback : calls
  ScriptRunner ..> ScriptFuncs : passes
  ScriptRunner ..> ScriptStart : start
  note "The script needs jQuery. One that throws is switched off for that view and view.on(error) says so."
]]></metadata>
