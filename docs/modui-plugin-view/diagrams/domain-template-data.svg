<svg viewBox="0 0 960 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="domain-template-data-title domain-template-data-desc">
<title id="domain-template-data-title">Template data</title>
<desc id="domain-template-data-desc">buildTemplateData turns TemplateInputs into a PreparedPlugin with the Mustache data, a PreparedEffect and one ControlSpec per control; the GuiFiles templates are rendered with it.</desc>
<metadata><![CDATA[
GENERATED by docs/modui-client/diagrams/src/build.py from specs.py (domain-template-data). Do not edit this file by hand.
Content of the diagram as Mermaid (a summary for readers and AI tools; the layout lives in specs.py):

classDiagram
  direction LR
  class TemplateInputs {
    <<data>>
    info: PluginInfo
    version: string
    presets?: PluginPresetInfo[]
    files?: Mapstring, FileList
  }
  note for TemplateInputs "buildTemplateData(inputs)"
  class PreparedPlugin {
    <<focal data>>
    data: the Mustache view
    effect: PreparedEffect
    controls: Mapsymbol, ControlSpec
    parameters: Mapuri, ControlSpec
  }
  class GuiFiles {
    <<data>>
    iconTemplate: string or null
    settingsTemplate: string or null
    stylesheet , javascript
    errors: file, error
  }
  note for GuiFiles "PluginGui.getAll() (client)"
  class PreparedEffect {
    <<data>>
    uri , name: string
    ports: audio, control, cv, midi
    all_control_in_ports
    parameters: WireParameter[]
    gui , renderedVersion
    presets: PluginPresetInfo[]
  }
  class ControlSpec {
    <<data>>
    kind , key , name
    ranges , units , format
    scalePoints , properties
    files?: FileEntry[]
  }
  class FileEntry {
    <<data>>
    fullname , basename: string
    dirname: string
    basepath? , filetype?
    icon?: HTML
  }
  note for FileEntry "GET /files/list"
  TemplateInputs ..> PreparedPlugin : builds
  PreparedPlugin "1" *-- "1" PreparedEffect : effect
  PreparedPlugin "1" *-- "0..*" ControlSpec : controls
  ControlSpec "1" *-- "0..*" FileEntry : files
  GuiFiles ..> PreparedPlugin : rendered with
  note "The icon and settings templates (the plugin's own or the default ones) are rendered with prepared.data (Mustache)."
]]></metadata>
