classDiagram
  direction LR
  class PluginViews {
    <<focal class>>
  }
  note for PluginViews "once per client"
  class PluginGui {
    <<see another diagram>>
  }
  note for PluginGui "plugin.gui, from modui-client"
  class StyleManager {
    <<class>>
  }
  note for StyleManager "global stylesheets"
  class PluginView {
    <<class>>
