<svg viewBox="0 0 960 516" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="domain-overview-title domain-overview-desc">
<title id="domain-overview-title">modui-plugin-view overview</title>
<desc id="domain-overview-desc">PluginViews reads the modgui files through the client's PluginGui, links stylesheets and creates PluginViews; a PluginView owns its rendered template data, widgets, a backend that is live or a preview, and the plugin script.</desc>
<metadata><![CDATA[
