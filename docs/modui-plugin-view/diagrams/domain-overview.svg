  class PluginInstance {
    <<see another diagram>>
  }
  note for PluginInstance "from modui-client"
  PluginViews ..> PluginGui : reads
  PluginViews ..> StyleManager : links
  PluginViews "1" *-- "0..*" PluginView : creates
  PluginView "1" *-- "1" PreparedPlugin : renders
  PluginView "1" *-- "0..*" Widget : widgets
  PluginView "1" *-- "1" ViewBackend : backend
  PluginView "1" *-- "0..1" ScriptRunner : script
  ViewBackend "1" ..> "0..1" PluginInstance : live only
  note "A view owns its widgets, its backend and its script; you only hold the view."
]]></metadata>
