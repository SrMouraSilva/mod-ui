<svg viewBox="0 0 1040 568" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
<title id="architecture-title">modui-plugin-view architecture</title>
<desc id="architecture-desc">Your application creates views with PluginViews, which fetches the modgui files from mod-ui; a PluginView writes through a ViewBackend to a PluginInstance of modui-client and receives its events back; modui-plugin-view imports only types from modui-client.</desc>
<metadata><![CDATA[
