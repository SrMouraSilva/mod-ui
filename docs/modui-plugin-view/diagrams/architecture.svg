flowchart LR
  subgraph APPLICATION["APPLICATION"]
    app["Your application<br/>React · Vue · vanilla JS<br/>places icon and settings"]
  end
  subgraph MODUIPLUGINVIEW["MODUI-PLUGIN-VIEW"]
    views["PluginViews<br/>once per client<br/>files · styles · outputs"]
    view["PluginView<br/>icon · settings<br/>widgets · plugin script"]
    backend["ViewBackend<br/>LiveBackend: client<br/>PreviewBackend: memory"]
  end
  subgraph MODUICLIENT["MODUI-CLIENT"]
    client["ModUiClient<br/>client.events<br/>client.device"]
    inst["PluginInstance<br/>params · patch · presets<br/>setValue() · setActive()"]
  end
  subgraph MODUISERVER["MOD-UI SERVER"]
    files["Modgui files<br/>/effect/file · /resources<br/>templates · css · script"]
    web["Webserver<br/>/websocket · HTTP<br/>param_set · patch_set"]
  end
  app -->|"create()"| views
  app -->|"on()"| view
  views -->|"creates"| view
  view -->|"uses"| backend
  views -->|"output_set"| client
  views -->|"fetch"| files
  backend -->|"writes"| inst
  inst -->|"events"| backend
  inst <-->|"ws"| web
]]></metadata>
