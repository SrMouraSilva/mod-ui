<title id="domain-views-title">PluginViews</title>
<desc id="domain-views-desc">PluginViews, configured by PluginViewsOptions, creates PluginView objects from CreateViewOptions; it reads the modgui files through the client's PluginGui and links the global stylesheets through a StyleManager.</desc>
