<title id="dependency-age-title">How old the dependencies are, and how much code leans on them</title>
<desc id="dependency-age-desc">A scatter of third-party pieces by release year and by the number of source files that use them: Python 3.4, Tornado 4.3 and jQuery 1.9.1 are old and widely used; Knockout and LESS are shipped but loaded by no page.</desc>
