<title id="layers-title">The layers of mod-ui and how much code each holds</title>
<desc id="layers-desc">Seven layers from the browser to the platform, each with its files and size; the Tornado handlers skip layers to reach the Host and the native bridge directly, and the Host class mixes six kinds of work.</desc>
