<title id="remote-load-title">How a pedalboard from the website reaches the device</title>
<desc id="remote-load-desc">Sequence of loading a pedalboard from the mod.audio website: the page opens a socket to the device, which forwards the id to the first open UI; the UI authenticates, fetches the record, installs missing plugins, downloads the archive and posts it to the device.</desc>
<metadata><![CDATA[
GENERATED by docs/mod-ui/diagrams/src/build.py from specs.py (remote-load). Do not edit this file by hand.
Content of the diagram as Mermaid or plain data (a summary for readers and AI tools; the layout lives in specs.py):

sequenceDiagram
  participant P as mod.audio page
  participant M as mod-ui
  participant U as Browser UI
  participant C as Cloud
  P->>M: ws /rpbsocket (origin check)
  P->>M: pedalboard id
  M->>U: load-pb-remote id
  M-->>P: true, close
  U->>C: GET /pedalboards/id
  U->>M: POST /effect/bulk
  U->>C: download missing plugins
  U->>C: GET file_href
  U->>M: POST /pedalboard/load_web/
]]></metadata>
