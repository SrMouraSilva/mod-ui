<svg viewBox="0 0 1040 820" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="startup-title startup-desc">
<title id="startup-title">How mod-ui starts</title>
<desc id="startup-desc">Sequence of the start-up: importing the webserver creates the Session and the Host, then the loop starts and the Host connects to JACK and mod-host, reads the banks and the pedalboards, waits for the HMI and reloads the last pedalboard.</desc>
<metadata><![CDATA[
GENERATED by docs/mod-ui/diagrams/src/build.py from specs.py (startup). Do not edit this file by hand.
Content of the diagram as Mermaid or plain data (a summary for readers and AI tools; the layout lives in specs.py):

sequenceDiagram
  participant S as server.py
  participant E as Session
  participant H as Host
  participant L as libmod_utils
  participant M as mod-host
  S->>E: import mod.session: SESSION = Session()
  E->>H: Host(hmi, prefs, cb), schedules init_host
  S->>S: check_environment, favorites
  S->>L: init (scan LV2)
  S->>S: listen, IOLoop.start
  H->>L: init_jack client mod-ui
  H->>M: connect 5555/5556, processing 0, remove -1
  H->>H: wait for the HMI (5 s)
  H->>L: get_pedalboard_info(last)
  H->>M: add, connect, state_load
  H->>M: monitor_midi_program, processing 2
  H->>L: init_bypass
]]></metadata>
