<title id="jack-graph-title">The JACK graph around the pedalboard</title>
<desc id="jack-graph-desc">The JACK clients of a MOD device as mod-ui names them: hardware and external inputs on the left, mod-host with one client per plugin in the middle, and mod-monitor, USB, CV and MIDI outputs on the right.</desc>
<metadata><![CDATA[
GENERATED by docs/modui-client/diagrams/src/build.py from specs.py (jack-graph). Do not edit this file by hand.
Content of the diagram as Mermaid (a summary for readers and AI tools; the layout lives in specs.py):

classDiagram
  direction LR
  class Audioin {
    <<ext>>
  }
  class USBandexternal {
    <<ext>>
  }
  class CVandpedalin {
    <<ext>>
  }
  class MIDIin {
    <<ext>>
  }
  class modhost {
    <<focal ext>>
  }
  class Audioout {
    <<ext>>
  }
  class USBandexternalout {
    <<ext>>
  }
  class CVout {
    <<ext>>
  }
  class MIDIout {
    <<ext>>
  }
  Audioin ..> modhost
  modhost ..> Audioout
  USBandexternal ..> modhost
  modhost ..> USBandexternalout
  CVandpedalin ..> modhost
  modhost ..> CVout
  MIDIin ..> modhost
  modhost ..> MIDIout
  note "mod-ui itself is a JACK client (mod-ui): it connects ports for the tuner, mute and MIDI devices, reads buffer size, xruns and transport, and records mod-monitor:out_1 and out_2 with jack_capture."
  note "_fix_host_connection_port() turns /graph/playback_1 into mod-monitor:in_1, /graph/cv_capture_N into mod-spi2jack:capture_N, and /graph/plugin/port into effect_id:port; anything else is guessed as system:name."
]]></metadata>
