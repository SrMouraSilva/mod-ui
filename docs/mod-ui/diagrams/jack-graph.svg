<text x="48" y="584" fill="#5c4a64" font-size="12" font-style="italic" font-family="'Instrument Serif', serif">mod-ui itself is a JACK client ("mod-ui"): it connects ports for the tuner, mute and MIDI devices,</text>
<text x="48" y="598" fill="#5c4a64" font-size="12" font-style="italic" font-family="'Instrument Serif', serif">reads buffer size, xruns and transport, and records mod-monitor:out_1 and out_2 with jack_capture.</text>
<text x="48" y="632" fill="#5c4a64" font-size="12" font-style="italic" font-family="'Instrument Serif', serif">_fix_host_connection_port() turns /graph/playback_1 into mod-monitor:in_1, /graph/cv_capture_N into mod-spi2jack:capture_N,</text>
<text x="48" y="646" fill="#5c4a64" font-size="12" font-style="italic" font-family="'Instrument Serif', serif">and /graph/&lt;plugin&gt;/&lt;port&gt; into effect_&lt;id&gt;:&lt;port&gt;; anything else is guessed as system:&lt;name&gt;.</text>
