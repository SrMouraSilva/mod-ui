<title id="improvements-title">Improvements, by effort and impact</title>
<desc id="improvements-desc">A quadrant of ten improvements by estimated effort and impact; healing the mod-host link without a browser and protecting the local API are cheap and valuable, describing devices as data is the structural one, and splitting host.py is expensive but valuable.</desc>
