<text x="40" y="456" fill="#5c4a64" font-size="12" font-style="italic" font-family="'Instrument Serif', serif">The descriptor reads are the only coupling that is declared as data, so a new device can be described instead of coded.</text>
<text x="40" y="470" fill="#5c4a64" font-size="12" font-style="italic" font-family="'Instrument Serif', serif">Everything else is a string that has to match the image: rename a path or a JACK client in the image and the code has to be edited by hand.</text>
