<title id="coupling-title">What the code is tied to</title>
<desc id="coupling-desc">Bars count the places where the Python and C++ code depend on the MOD OS image or on a named device: fixed paths, fixed JACK client names, shell-outs, descriptor reads and device names.</desc>
<metadata><![CDATA[
GENERATED by docs/mod-ui/diagrams/src/build.py from specs.py (coupling). Do not edit this file by hand.
Content of the diagram as Mermaid or plain data (a summary for readers and AI tools; the layout lives in specs.py):

%% Counted from the working tree (see measure.py)
%% Fixed paths of the OS image (/data /root /etc/mod /usr/bin /usr/share /sys /proc): 97 string literals
%% Fixed JACK client names (mod-monitor, mod-host, ttymidi, ...): 68 string literals
%% Shell-outs (mod-amixer, systemctl, tar, reboot, ...): 56 call sites
%% Hardware-descriptor reads (what the device is allowed to do): 56 reads
%% Device or build names (DUO, DUOX, DWARF, DESKTOP, ...): 22 mentions
]]></metadata>
