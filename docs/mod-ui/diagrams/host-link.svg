<svg viewBox="0 0 1040 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="host-link-title host-link-desc">
<title id="host-link-title">The link between the Host and mod-host</title>
<desc id="host-link-desc">States of the Host connection to mod-host: starting, connecting, running, crashed and the exit at start-up; after a crash with no browser open the sockets come back but every command is dropped until a browser opens the UI.</desc>
<metadata><![CDATA[
GENERATED by docs/modui-client/diagrams/src/build.py from specs.py (host-link). Do not edit this file by hand.
Content of the diagram as Mermaid (a summary for readers and AI tools; the layout lives in specs.py):

classDiagram
  direction LR
  class Starting {
    <<state>>
  }
  class Connecting {
    <<state>>
  }
  class Running {
    <<state>>
  }
  class Linkedmute {
    <<focal state>>
  }
  class Crashed {
    <<state>>
  }
  class Exit {
    <<end>>
  }
  Starting ..> Connecting : open sockets
  Connecting ..> Running : sockets up
  Connecting ..> Linkedmute : up , no ui
  Linkedmute ..> Running : ui opens
  Running ..> Crashed : socket closed
  Crashed ..> Connecting : 5 s , ui opens
  Connecting ..> Exit : start-up fail
  note "After a crash with no browser open, the sockets reconnect but crashed stays True: only report_current_state(), which needs a websocket, resets it."
  note "reconnect_jack() tries once; if init_jack() fails nothing schedules another try. Both are a reading of the code and have not been run on a device."
]]></metadata>
