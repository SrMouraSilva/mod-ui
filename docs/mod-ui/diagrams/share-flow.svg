<svg viewBox="0 0 1040 704" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="share-flow-title share-flow-desc">
<title id="share-flow-title">How a pedalboard is shared</title>
<desc id="share-flow-desc">Sequence of sharing a pedalboard: the browser saves the author name and email locally, waits for the thumbnail, authenticates, creates the pedalboard record in the cloud, asks mod-ui to pack the bundle and uploads the archive, relaying the bytes itself.</desc>
<metadata><![CDATA[
GENERATED by docs/mod-ui/diagrams/src/build.py from specs.py (share-flow). Do not edit this file by hand.
Content of the diagram as Mermaid or plain data (a summary for readers and AI tools; the layout lives in specs.py):

sequenceDiagram
  participant B as Browser
  participant M as mod-ui
  participant C as Cloud
  B->>M: POST /save_user_id/ name, email
  B->>M: GET /pedalboard/image/wait
  B->>C: authenticate (see cloud-auth)
  B->>C: POST /pedalboards/ author, email, title, description, hidden
  C-->>B: id, upload_href
  B->>M: GET /pedalboard/pack_bundle/
  M-->>B: pedalboard.tar.gz (+ audio.ogg)
  B->>C: upload to upload_href
  C-->>B: ok
]]></metadata>
