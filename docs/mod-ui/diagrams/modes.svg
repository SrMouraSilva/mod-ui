<svg viewBox="0 0 1040 752" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="modes-title modes-desc">
<title id="modes-title">What is real in each way of running mod-ui</title>
<desc id="modes-desc">A matrix of eight components against three runtime modes: on a MOD device everything is real; in MOD Desktop the HMI is a fake, Control Chain, the hardware descriptor and the OS tools are absent; in development mod-host is also a fake.</desc>
<metadata><![CDATA[
GENERATED by docs/mod-ui/diagrams/src/build.py from specs.py (modes). Do not edit this file by hand.
Content of the diagram as Mermaid or plain data (a summary for readers and AI tools; the layout lives in specs.py):

%% Matrix: component x mode, value = real | fake | absent (note)
%% Python server | device: real (systemd, Python 3.4) | desktop: real (frozen, 127.0.0.1) | dev: real (python3 server.py :8888)
%% mod-host + JACK | device: real | desktop: real (started by the app) | dev: fake (FakeHost, MOD_DEV_HOST)
%% libmod_utils | real | real (_MOD_DESKTOP, no ALSA) | real
%% HMI serial | device: real | desktop: fake (port does not open) | dev: fake (FakeHMI)
%% Control Chain | device: real | desktop: absent (socket missing) | dev: absent
%% Hardware descriptor | device: real | desktop: absent | dev: absent
%% OS tools | device: real | desktop: absent | dev: absent
%% Cloud and store | device: real | desktop: partial (locked panels) | dev: real
]]></metadata>
