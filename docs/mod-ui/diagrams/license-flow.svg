classDiagram
  direction LR
  class Pluginscan {
    <<clib>>
  }
  class Hasalicenseinterface {
    <<step>>
  }
  class licensed0 {
    <<step>>
  }
  class Keyfilepresent {
    <<step>>
  }
  class licensed1 {
    <<step>>
  }
  class licensed1 {
    <<focal step>>
  }
  class Whatmoduidoes {
    <<backend>>
  }
  class Wherethekeycomesfrom {
    <<ext>>
  }
  class Whoenforcesit {
    <<ext>>
  }
  Pluginscan ..> Hasalicenseinterface
  Hasalicenseinterface ..> Keyfilepresent : yes
  Hasalicenseinterface ..> licensed0 : no
  Keyfilepresent ..> licensed1 : no
  Keyfilepresent ..> licensed1 : yes
  licensed1 ..> Whatmoduidoes
  Wherethekeycomesfrom ..> licensed0
  licensed1 ..> Whoenforcesit : ERR -4 if unlicensed
  note "The key file is never created, read or validated by mod-ui: libmod_utils only tests that it exists. Deleting the keys directory is one of the cleanup options (licenseKeys in /system/cleanup)."
]]></metadata>
