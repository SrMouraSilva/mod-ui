<svg viewBox="0 0 1040 732" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="license-flow-title license-flow-desc">
<title id="license-flow-title">How mod-ui classifies a paid plugin</title>
<desc id="license-flow-desc">mod-ui does not verify licenses: it only checks whether a file named after the SHA-1 of the plugin URI exists in the keys directory for plugins that declare a license interface, and reports free, paid or trial; enforcement lives in the plugin and in mod-host.</desc>
<metadata><![CDATA[
