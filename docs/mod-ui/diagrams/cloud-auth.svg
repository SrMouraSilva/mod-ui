<svg viewBox="0 0 1040 768" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cloud-auth-title cloud-auth-desc">
<title id="cloud-auth-title">How the device proves who it is to the cloud</title>
<desc id="cloud-auth-desc">Sequence of the device authentication: the cloud sends a nonce, mod-ui signs it with the device private key and encrypts it for the cloud, the cloud answers with an encrypted token that mod-ui decrypts, and the browser keeps the token in memory.</desc>
<metadata><![CDATA[
GENERATED by docs/mod-ui/diagrams/src/build.py from specs.py (cloud-auth). Do not edit this file by hand.
Content of the diagram as Mermaid or plain data (a summary for readers and AI tools; the layout lives in specs.py):

sequenceDiagram
  participant B as Browser
  participant M as mod-ui
  participant C as Cloud
  B->>C: GET /devices/nonce
  C-->>B: nonce
  B->>M: POST /auth/nonce
  M->>M: sign with device key, encrypt for the cloud
  M-->>B: message
  B->>C: POST /devices/tokens
  C-->>B: message, signature
  B->>M: POST /auth/token
  M->>M: decrypt, verify the cloud signature
  M-->>B: access_token
]]></metadata>
