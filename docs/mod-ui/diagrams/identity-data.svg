<svg viewBox="0 0 1040 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="identity-data-title identity-data-desc">
<title id="identity-data-title">What identifies the device and what the user types</title>
<desc id="identity-data-desc">The device is identified to the cloud by its tag, uid and RSA key through a signed nonce; a person appears only as a free-text name and email in the share form, which mod-ui keeps in user-id.json to prefill the form; TONE3000 has its own sign-in.</desc>
<metadata><![CDATA[
GENERATED by docs/modui-client/diagrams/src/build.py from specs.py (identity-data). Do not edit this file by hand.
Content of the diagram as Mermaid (a summary for readers and AI tools; the layout lives in specs.py):

classDiagram
  direction LR
  class Deviceidentity {
    <<store>>
  }
  class moduicrypto {
    <<http>>
  }
  class Browser {
    <<focal legacy>>
  }
  class modaudiocloud {
    <<cloud>>
  }
  class useridjson {
    <<store>>
  }
  class prefsjson {
    <<store>>
  }
  class TONE3000 {
    <<cloud>>
  }
  Deviceidentity ..> moduicrypto : reads
  moduicrypto ..> Browser : message , token
  Browser ..> modaudiocloud : https , MOD token
  useridjson ..> Browser : prefills form
  prefsjson ..> Browser : terms , key
  Browser ..> TONE3000 : oauth
  note "/tokens/get, /tokens/save and /tokens/delete store a user_id, an access token and a refresh token in tokens.conf, but no script in this repository calls them."
]]></metadata>
