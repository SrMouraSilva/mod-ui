<svg viewBox="0 0 992 752" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="context-title context-desc">
<title id="context-title">mod-ui in its surroundings</title>
<desc id="context-desc">The classic UI and typed clients reach a Tornado webserver; Session and Host drive mod-host, the HMI and Control Chain, and libmod_utils reaches JACK and ALSA; the cloud is reached by the browser, and its website can push installs back over two sockets.</desc>
<metadata><![CDATA[
GENERATED by docs/modui-client/diagrams/src/build.py from specs.py (context). Do not edit this file by hand.
Content of the diagram as Mermaid (a summary for readers and AI tools; the layout lives in specs.py):

classDiagram
  direction LR
  class modaudiocloud {
    <<cloud>>
  }
  class ClassicUI {
    <<legacy>>
  }
  class moduiclient {
    <<client>>
  }
  class Webserver {
    <<http>>
  }
  class SessionHost {
    <<focal backend>>
  }
  class libmod_utils {
    <<clib>>
  }
  class HMI {
    <<ext>>
  }
  class ControlChain {
    <<ext>>
  }
  class modhostJACK {
    <<ext>>
  }
  ClassicUI ..> modaudiocloud : https
  modaudiocloud ..> Webserver : rpl , rpb ws
  ClassicUI ..> Webserver : http , ws
  moduiclient ..> Webserver : http , ws
  Webserver ..> SessionHost : calls
  SessionHost ..> Webserver : broadcast
  SessionHost ..> libmod_utils : ctypes
  SessionHost ..> HMI : serial
  SessionHost ..> ControlChain : socket
  SessionHost ..> modhostJACK : tcp
  libmod_utils ..> modhostJACK : jack , alsa
  note "The server never calls the cloud: the browser brokers every request."
]]></metadata>
