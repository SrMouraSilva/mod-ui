<svg viewBox="0 0 1040 964" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="state-owners-title state-owners-desc">
<title id="state-owners-title">Who owns what: Session, Host and the rest</title>
<desc id="state-owners-desc">A matrix of seventeen pieces of state against the browser, webserver, session, host, mod-host and the disk: the Host owns the current pedalboard, the tuner, the transport, the MIDI ports, the profiles and the link to mod-host; the Session owns the browsers, the preferences, the recorder and the thumbnail queue.</desc>
