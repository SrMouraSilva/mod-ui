<text x="40" y="824" fill="#5c4a64" font-size="12" font-style="italic" font-family="'Instrument Serif', serif">Banks have two owners: the HMI edits them through the Host, the browser saves banks.json directly in BankSave, and the Host reloads its copy only when the last browser leaves.</text>
<text x="40" y="838" fill="#5c4a64" font-size="12" font-style="italic" font-family="'Instrument Serif', serif">mod-host holds the live instances, but it is not the source of truth: after a crash the Host rebuilds it from its own copy.</text>
