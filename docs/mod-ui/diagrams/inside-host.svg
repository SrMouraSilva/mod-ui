<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="inside-host-title inside-host-desc">
<title id="inside-host-title">What the Host holds</title>
<desc id="inside-host-desc">The state inside the Host object: the current pedalboard with its plugin records, connections, snapshots and addressings, the banks, the tuner, the transport, the profile and the links to mod-host and the HMI; next to it, what the Session and the webserver keep.</desc>
<metadata><![CDATA[
GENERATED by docs/mod-ui/diagrams/src/build.py from specs.py (inside-host). Do not edit this file by hand.
Content of the diagram as Mermaid or plain data (a summary for readers and AI tools; the layout lives in specs.py):

%% Host (host.py) holds: pedalboard identity, plugins{id -> record}, connections, snapshots, addressings, banks, tuner, transport, profile, mod-host link, HMI link, timers.
%% Session holds: websockets, prefs, recorder, player, screenshot generator, hmi.
%% Webserver holds: favourites.
]]></metadata>
