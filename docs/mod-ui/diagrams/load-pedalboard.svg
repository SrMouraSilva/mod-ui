<svg viewBox="0 0 1040 904" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="load-pedalboard-title load-pedalboard-desc">
<title id="load-pedalboard-title">What happens when a pedalboard is loaded</title>
<desc id="load-pedalboard-desc">Sequence of a pedalboard load: the browser posts the bundle, the Host reads it through libmod_utils, tells mod-host to add every plugin and connection while pushing the same frames to the browsers, then confirms with loading_end and the HTTP answer.</desc>
<metadata><![CDATA[
GENERATED by docs/mod-ui/diagrams/src/build.py from specs.py (load-pedalboard). Do not edit this file by hand.
Content of the diagram as Mermaid or plain data (a summary for readers and AI tools; the layout lives in specs.py):

sequenceDiagram
  participant B as Browser
  participant W as Webserver
  participant H as Host
  participant L as libmod_utils
  participant M as mod-host
  B->>W: POST /pedalboard/load_bundle/
  W->>H: SESSION.load_pedalboard(bundle)
  H->>L: get_pedalboard_info(bundle)
  L-->>H: plugins, connections
  H--)B: loading_start, size
  loop each plugin
    H->>M: add uri id
    H--)B: add instance
  end
  loop each connection
    H->>M: connect a b
    H--)B: connect a b
  end
  H->>M: state_load bundle
  H--)B: loading_end
  W-->>B: 200 ok, name
]]></metadata>
