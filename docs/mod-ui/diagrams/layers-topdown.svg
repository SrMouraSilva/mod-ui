<svg viewBox="0 0 1040 824" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="layers-topdown-title layers-topdown-desc">
<title id="layers-topdown-title">One call, top to bottom and back: adding a plugin</title>
<desc id="layers-topdown-desc">A trace of adding a plugin through the layers: the browser calls the webserver, which calls the Session, which calls the Host; the Host asks libmod_utils for the description, sends add to mod-host, and the answer climbs back as a callback, a WebSocket frame to every browser and the HTTP response.</desc>
<metadata><![CDATA[
GENERATED by docs/mod-ui/diagrams/src/build.py from specs.py (layers-topdown). Do not edit this file by hand.
Content of the diagram as Mermaid or plain data (a summary for readers and AI tools; the layout lives in specs.py):

flowchart TB
  L7["1 pedalboard.js GET /effect/add"] --> L6["2 EffectAdd.get"] --> L5["3 Session.web_add"] --> L4["4 Host.add_plugin"] --> L3["5 Host._queue to mod-host"] --> L1["6 mod-host add"]
  L4 -.-> L2["libmod_utils get_plugin_info_essentials"]
  L1 --> R3["7 resp 12"] --> R4["8 plugins[12] and msg_callback"] --> R5["9 Session.msg_callback"] --> R6["10 write_message"] --> R7["11 host.js draws it"]
]]></metadata>
