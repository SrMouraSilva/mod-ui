<svg viewBox="0 0 1040 816" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="event-loop-title event-loop-desc">
<title id="event-loop-title">One thread and three serialized request queues</title>
<desc id="event-loop-desc">A single Tornado thread serves the browsers, mod-host, the HMI and Control Chain; each device has its own first-in first-out queue that lets only one request fly at a time, and the browsers are throttled with data_ready; several calls block the thread.</desc>
<metadata><![CDATA[
GENERATED by docs/mod-ui/diagrams/src/build.py from specs.py (event-loop). Do not edit this file by hand.
Content of the diagram as Mermaid or plain data (a summary for readers and AI tools; the layout lives in specs.py):

flowchart LR
  IOLoop["Tornado IOLoop (1 thread)"] --> Q1["Host._queue"] --> M["mod-host :5555"]
  M -. "resp, events :5556" .-> IOLoop
  IOLoop --> Q2["HMI.queue"] --> H["HMI serial"]
  H -. reply .-> IOLoop
  IOLoop --> Q3["ControlChain.write_queue"] --> C["control-chain.sock"]
  C -. reply .-> IOLoop
  IOLoop -- write_message --> B["Browsers"]
  B -. data_ready .-> IOLoop
]]></metadata>
