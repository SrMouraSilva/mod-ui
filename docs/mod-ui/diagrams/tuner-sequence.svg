<svg viewBox="0 0 1040 884" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tuner-sequence-title tuner-sequence-desc">
<title id="tuner-sequence-title">How the tuner works</title>
<desc id="tuner-sequence-desc">Sequence of the tuner: the HMI asks the Host to turn it on, the Host adds a tuner plugin as instance 9994 in mod-host and connects an input to it, mod-host reports the frequency, the Host converts it to a note and sends it to the HMI; the Session takes no part.</desc>
<metadata><![CDATA[
GENERATED by docs/mod-ui/diagrams/src/build.py from specs.py (tuner-sequence). Do not edit this file by hand.
Content of the diagram as Mermaid or plain data (a summary for readers and AI tools; the layout lives in specs.py):

sequenceDiagram
  participant Hm as HMI
  participant H as Host
  participant M as mod-host
  participant L as libmod_utils
  Hm->>H: tn
  H->>M: add gxtuner 9994
  M-->>H: resp 9994
  H->>M: monitor_output 9994 FREQ
  H->>L: connect system:capture_N to effect_9994:in
  opt tuner mutes outputs
    H->>L: mute()
  end
  H-->>Hm: resp
  loop while on
    M--)H: output_set 9994 FREQ hz
    H->>Hm: ts freq note cents
  end
  Hm->>H: tf
  H->>M: remove 9994
  H->>L: unmute()
]]></metadata>
