<title id="devices-title">Where the code names a device</title>
<desc id="devices-desc">A heat map of the lines that name a MOD device or the Desktop build, per layer: Duo X and the HMI schema dominate on the device side, the Desktop build is a flag in the server and the browser, and the web layers never name a device.</desc>
<metadata><![CDATA[
GENERATED by docs/mod-ui/diagrams/src/build.py from specs.py (devices). Do not edit this file by hand.
Content of the diagram as Mermaid or plain data (a summary for readers and AI tools; the layout lives in specs.py):

