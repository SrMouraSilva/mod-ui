%% HMI schema · mod_protocol.py | 12 | 16 | 5 | 0 | 0
%% Host · host.py | 6 | 7 | 3 | 0 | 0
%% HMI driver · hmi.py | 4 | 5 | 1 | 0 | 0
%% Audio profile · profile.py | 2 | 2 | 2 | 0 | 0
