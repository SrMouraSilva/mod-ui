<svg viewBox="0 0 1040 864" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="frontend-title frontend-desc">
<title id="frontend-title">How the classic browser code is put together</title>
<desc id="frontend-desc">The page rendered by Tornado sets global variables and loads about twenty-eight scripts; the Desktop object builds every manager, the host.js router turns WebSocket frames into calls on it, and the whole thing stands on a 2013 jQuery stack.</desc>
